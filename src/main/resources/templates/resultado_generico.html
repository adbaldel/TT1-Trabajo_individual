<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Respuesta')}"></head>
<body class="pt-28 pb-10 px-4 flex justify-center items-start min-h-screen">
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="cyber-panel max-w-xl w-full p-8 mt-10 relative">
    <h2 class="absolute -top-4 left-4 bg-cyberbg px-2 text-cyberpurple cyber-title text-xl border-x border-cyberpurple">
        SYS.RESPONSE //
    </h2>

    <div th:if="${problemDetails != null}" class="border border-cyberpink bg-cyberpink/10 p-6 relative mt-8 mb-8 text-center min-h-[150px] flex items-center justify-center">
        <h3 class="text-sm cyber-title text-cyberpink bg-cyberbg px-2 absolute -top-3 left-4 border-x border-cyberpink">ERR_CRITICAL</h3>
        <span class="text-xl text-cyberpink drop-shadow-[0_0_8px_rgba(255,0,60,0.8)]" th:text="${problemDetails}">Mensaje de error</span>
    </div>

    <div th:if="${problemDetails == null}" class="border border-cybergreen/50 bg-cybergreen/10 p-6 relative mt-8 mb-8 text-center min-h-[150px] flex items-center justify-center">
        <h3 class="text-sm cyber-title text-cybergreen/70 bg-cyberbg px-2 absolute -top-3 left-4">OUTPUT_</h3>
        <span class="text-xl text-cybergreen drop-shadow-[0_0_8px_rgba(0,255,102,0.8)]" th:text="${resultado}">Aquí aparecerá el resultado</span>
    </div>

    <button onclick="window.history.back()" class="cyber-btn text-cyberpurple w-full py-4 text-xl">
        [ << RETORNAR ]
    </button>
</div>
</body>
</html>
