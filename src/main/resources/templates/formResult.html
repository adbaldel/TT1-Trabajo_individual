<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Resultado de la Solicitud</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		/* Shared Ocean & Island Theme */
		body {
			background-color: #006994;
			background-image: radial-gradient(circle at center, #00b4db 0%, #0083b0 100%);
			min-height: 100vh;
			margin: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			padding: 20px;
			box-sizing: border-box;
		}

		.island-card {
			background-color: #f4e4c1;
			background-image: radial-gradient(circle at top left, #fff0ce 0%, #e3cda3 100%);
			border-radius: 30px;
			padding: 40px;
			box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.5);
			max-width: 500px;
			width: 100%;
			text-align: center;
		}

		h2 {
			color: #5c4033;
			margin-top: 0;
			margin-bottom: 15px;
		}

		/* Token specific styles */
		p {
			color: #725340;
			font-size: 16px;
			line-height: 1.5;
			margin-bottom: 25px;
		}

		.token-badge {
			background: #ffffff;
			color: #0083b0;
			padding: 15px 30px;
			border-radius: 15px;
			border: 2px dashed #0083b0;
			display: inline-block;
			margin: 0;
			font-family: monospace;
			font-size: 28px;
			letter-spacing: 2px;
			box-shadow: 0 4px 6px rgba(0,0,0,0.05);
		}
	</style>
</head>
<body>
<div class="island-card">
	<h2>¡Solicitud Realizada!</h2>
	<p>Su solicitud se ha procesado con éxito. Puede descargar los resultados cuando estén disponibles utilizando el siguiente token:</p>
	<h1 class="token-badge" th:text="${token}"></h1>
</div>
</body>
</html>
