<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Configurar Simulación</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		/* Shared Ocean & Island Theme */
		body {
			/* Ocean background gradient */
			background-color: #006994;
			background-image: radial-gradient(circle at center, #00b4db 0%, #0083b0 100%);
			min-height: 100vh;
			margin: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			padding: 20px;
			box-sizing: border-box;
		}

		.island-card {
			/* Sand/Island look */
			background-color: #f4e4c1;
			background-image: radial-gradient(circle at top left, #fff0ce 0%, #e3cda3 100%);
			border-radius: 30px;
			padding: 40px;
			box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.5);
			max-width: 400px;
			width: 100%;
			text-align: center;
		}

		h2 {
			color: #5c4033; /* Dark earthy tone */
			margin-top: 0;
			margin-bottom: 25px;
		}

		/* Form Specific Styles */
		.form-group {
			margin-bottom: 20px;
			text-align: left;
		}

		label {
			display: block;
			margin-bottom: 8px;
			color: #5c4033;
			font-weight: 600;
		}

		input[type="number"] {
			width: 100%;
			padding: 12px;
			border: 2px solid #d4b886;
			border-radius: 12px;
			box-sizing: border-box;
			background: rgba(255, 255, 255, 0.8);
			color: #333;
			font-size: 16px;
			transition: all 0.3s ease;
		}

		input[type="number"]:focus {
			outline: none;
			border-color: #0083b0;
			background: #ffffff;
			box-shadow: 0 0 8px rgba(0, 131, 176, 0.3);
		}

		button {
			background: #0083b0;
			color: white;
			border: none;
			padding: 14px 24px;
			border-radius: 12px;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
			width: 100%;
			margin-top: 10px;
			transition: background 0.3s, transform 0.1s;
			box-shadow: 0 4px 6px rgba(0,0,0,0.1);
		}

		button:hover {
			background: #006994;
		}

		button:active {
			transform: scale(0.98);
		}
	</style>
</head>
<body>
<div class="island-card">
	<h2>Configurar Simulación</h2>
	<form th:action="@{/solicitud}" method="post">
		<div th:each="entity : ${entities}" class="form-group">
			<label th:for="${entity.id}" th:text="'Num. de ' + ${entity.name} + 's:'"></label>
			<input type="number" min="0" th:id="${entity.id}" th:name="${entity.id}" required />
		</div>
		<button type="submit">Solicitar Simulación</button>
	</form>
</div>
</body>
</html>
