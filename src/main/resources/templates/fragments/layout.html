<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Cyber_App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyberbg: '#050505',
                        cybersurface: '#121212',
                        cybercyan: '#00f3ff',
                        cyberpink: '#ff003c',
                        cyberyellow: '#fcee0a',
                        cybergreen: '#00ff66',
                        cyberpurple: '#b026ff'
                    },
                    fontFamily: {
                        sans: ['"Rajdhani"', 'sans-serif'],
                        display: ['"Orbitron"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            body {
                background-color: #050505;
                color: #e0e0e0;
                /* Dark Cyber-grid background */
                background-image:
                        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
                background-size: 30px 30px;
                background-position: -1px -1px;
            }

            /* Cyberpunk Base Classes */
            .cyber-panel {
                @apply bg-cybersurface border border-cybercyan/30 backdrop-blur-sm relative;
                box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
            }

            /* Corner accents for panels */
            .cyber-panel::before, .cyber-panel::after {
                content: '';
                @apply absolute w-4 h-4 border-cybercyan;
            }
            .cyber-panel::before { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
            .cyber-panel::after { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

            .cyber-title {
                @apply font-display tracking-widest uppercase;
                text-shadow: 0 0 8px currentColor;
            }

            /* Emissive Buttons */
            .cyber-btn {
                @apply relative font-display uppercase tracking-widest font-bold border border-current transition-all duration-300 bg-transparent overflow-hidden;
                text-shadow: 0 0 5px currentColor;
                box-shadow: inset 0 0 0 transparent, 0 0 5px currentColor;
            }
            .cyber-btn:hover {
                @apply bg-current text-cyberbg;
                box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 20px currentColor;
                text-shadow: none;
            }

            /* HUD-style Inputs */
            .cyber-input {
                @apply bg-cyberbg/50 border-b-2 border-cybercyan/50 text-cybercyan font-display transition-all duration-200 outline-none w-full;
            }
            .cyber-input:focus {
                @apply border-cybercyan bg-cybercyan/10;
                box-shadow: 0 5px 10px -5px rgba(0, 243, 255, 0.4);
            }
        }
    </style>
</head>
<body class="pt-28 pb-10 px-4 flex justify-center items-start min-h-screen font-sans">

<nav th:fragment="navbar" class="fixed top-0 left-0 w-full bg-cyberbg/90 border-b border-cybercyan/30 backdrop-blur-md flex items-center justify-center p-4 z-50 min-h-[80px]" style="box-shadow: 0 4px 20px rgba(0, 243, 255, 0.15);">

    <div class="flex flex-wrap justify-center gap-4">
        <a th:href="@{/solicitar}" class="cyber-btn px-5 py-2 text-cybercyan no-underline">Nueva Simulación</a>
        <a th:href="@{/estado}" class="cyber-btn px-5 py-2 text-cyberpink no-underline">Comprobar Estado</a>
        <a th:href="@{/mis-solicitudes}" class="cyber-btn px-5 py-2 text-cyberpurple no-underline">Mis Solicitudes</a>
        <a th:href="@{/resultado}" class="cyber-btn px-5 py-2 text-cybergreen no-underline">Ver Resultado</a>
        <a th:href="@{/email}" class="cyber-btn px-5 py-2 text-cyberyellow no-underline">Enviar Email</a>
    </div>

    <div class="absolute right-4 top-4" th:if="${session.nombreUsuario != null}">
        <div class="relative inline-block text-left">
            <button type="button" class="cyber-btn text-cybercyan px-4 py-2 flex items-center gap-2" id="user-menu-button" aria-expanded="true" aria-haspopup="true" onclick="toggleUserDropdown()">
                <span th:text="${session.nombreUsuario}" class="max-w-[100px] truncate">User</span>
                <svg class="-mr-1 h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
                </svg>
            </button>

            <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 cyber-panel border border-cyberpink z-50 transition-all origin-top-right" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
                <div class="py-1" role="none">
                    <a th:href="@{/logout}" class="block px-4 py-3 text-lg font-bold text-cyberpink hover:bg-cyberpink hover:text-cyberbg transition-colors" role="menuitem" tabindex="-1">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleUserDropdown() {
            document.getElementById('user-dropdown').classList.toggle('hidden');
        }
        window.onclick = function(event) {
            if (!event.target.closest('#user-menu-button')) {
                const dropdown = document.getElementById('user-dropdown');
                if (dropdown && !dropdown.classList.contains('hidden')) {
                    dropdown.classList.add('hidden');
                }
            }
        }
    </script>
</nav>

</body>
</html>
