<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Enviar Email')}"></head>
<body class="pt-28 pb-10 px-4 flex justify-center items-start min-h-screen">
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="cyber-panel max-w-xl w-full p-8 mt-10 relative">
    <h2 class="absolute -top-4 left-4 bg-cyberbg px-2 text-cyberyellow cyber-title text-xl border-x border-cyberyellow">
        COMM.NOTIFY //
    </h2>

    <form th:action="@{/email}" method="post" class="space-y-8 mt-8">
        <div class="border border-cyberyellow/30 bg-cyberbg/50 p-6 relative space-y-6">
            <h3 class="text-sm cyber-title text-cyberyellow/70 bg-cyberbg px-2 absolute -top-3 left-4">PAYLOAD_</h3>

            <div class="flex flex-col gap-2 mt-2">
                <label for="email" class="font-display text-cyberyellow/70 text-sm uppercase tracking-widest">DESTINO_EMAIL_</label>
                <input type="email" id="email" class="cyber-input focus:border-cyberyellow text-cyberyellow focus:bg-cyberyellow/10 border-cyberyellow/50 p-2 text-xl" name="email" required />
            </div>

            <div class="flex flex-col gap-2">
                <label for="mensaje" class="font-display text-cyberyellow/70 text-sm uppercase tracking-widest">CONTENIDO_</label>
                <textarea id="mensaje" name="mensaje" rows="4" class="cyber-input focus:border-cyberyellow text-cyberyellow focus:bg-cyberyellow/10 border-cyberyellow/50 p-2 text-xl resize-none" required></textarea>
            </div>
        </div>

        <button type="submit" class="cyber-btn text-cyberyellow w-full py-4 text-xl">
            [ TRANSMITIR ]
        </button>
    </form>
</div>
</body>
</html>
