<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Comprobar Simulación')}"></head>
<body class="pt-28 pb-10 px-4 flex justify-center items-start min-h-screen">
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="cyber-panel max-w-xl w-full p-8 mt-10 relative">
    <h2 class="absolute -top-4 left-4 bg-cyberbg px-2 text-cyberpink cyber-title text-xl border-x border-cyberpink">
        SYS.STATUS //
    </h2>

    <form th:action="@{/estado}" method="post" class="space-y-8 mt-8">
        <div class="border border-cyberpink/30 bg-cyberbg/50 p-6 relative space-y-6">
            <h3 class="text-sm cyber-title text-cyberpink/70 bg-cyberbg px-2 absolute -top-3 left-4">QUERY_DATA_</h3>

            <div class="flex flex-col gap-2 mt-2">
                <label for="token" class="font-display text-cyberpink/70 text-sm uppercase tracking-widest">TOKEN_ID_</label>
                <input type="number" id="token" class="cyber-input focus:border-cyberpink text-cyberpink focus:bg-cyberpink/10 border-cyberpink/50 p-2 text-xl" name="token" required />
            </div>
        </div>

        <button type="submit" class="cyber-btn text-cyberpink w-full py-4 text-xl">
            [ COMPROBAR_ESTADO ]
        </button>
    </form>
</div>
</body>
</html>
